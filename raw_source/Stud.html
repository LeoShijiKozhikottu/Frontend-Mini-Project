<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login Portal</title>
    <style>
        :root {
            --primary: #2980b9;
            --dark: #2c3e50;
            --error: #e74c3c;
            --bg: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-card {
            background: #ffffff;
            max-width: 450px;
            width: 100%;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h2 {
            color: var(--dark);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 8px;
        }

        .audio-section {
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid var(--primary);
        }

        .audio-section p {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #666;
            font-weight: bold;
        }

        audio {
            width: 100%;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--dark);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 5px rgba(41, 128, 185, 0.3);
        }

        .error-message {
            color: var(--error);
            font-size: 12px;
            margin-top: 4px;
            display: none;
            font-weight: 500;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            padding: 5px 0;
        }

        .radio-label, .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            cursor: pointer;
        }

        .links-group {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .links-group a {
            color: var(--primary);
            text-decoration: none;
        }

        .links-group a:hover {
            text-decoration: underline;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button[type="submit"] {
            background-color: var(--primary);
            color: white;
        }

        button[type="button"] {
            background-color: #95a5a6;
            color: white;
        }

        /* Result Div Box Styling */
        #outputDiv {
            display: none;
            max-width: 450px;
            width: 100%;
            margin-top: 25px;
            padding: 20px;
            background-color: #2ecc71;
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        #outputDiv h3 {
            margin-top: 0;
            border-bottom: 1px solid rgba(255,255,255,0.4);
            padding-bottom: 5px;
        }

        #outputDiv p {
            margin: 8px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Portal Login</h2>
        
        <!-- Audio Instructions Element -->
        <div class="audio-section">
            <p>🔊 Listen to Login Instructions:</p>
            <audio controls>
                <source src="https://w3schools.com" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
            
            <!-- Username/Email Field -->
            <div class="form-group">
                <label for="userIdent">Username or Email Address</label>
                <input type="text" id="userIdent" placeholder="Enter username or email">
                <div class="error-message" id="userIdentErr">Please enter your username or email address.</div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">
                <div class="error-message" id="passwordErr">Please enter your password.</div>
            </div>

            <!-- User Role Radio Fields -->
            <div class="form-group">
                <label>User Role</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="userRole" value="Student"> Student
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="userRole" value="Faculty"> Faculty
                    </label>
                </div>
                <div class="error-message" id="roleErr">Please select your user role.</div>
            </div>

            <!-- Remember Me Checkbox -->
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberMe"> Remember Me
                </label>
            </div>

            <!-- Hyperlinks Block -->
            <div class="links-group">
                <a href="#forgot">Forgot Password?</a>
                <a href="#register">Create New Account</a>
            </div>

            <!-- Action Buttons -->
            <div class="btn-group">
                <button type="submit">Login</button>
                <button type="button" onclick="clearForm()">Clear</button>
            </div>

        </form>
    </div>

    <!-- Output Wrapper Presentation Div -->
    <div id="outputDiv"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            // Stop automatic submission to execute JavaScript validation
            event.preventDefault();
            
            // Flag tracker status
            let hasErrors = false;

            // Fetch input data handles
            const userIdentInput = document.getElementById('userIdent');
            const passwordInput = document.getElementById('password');
            const roleSelected = document.querySelector('input[name="userRole"]:checked');
            const rememberMeChecked = document.getElementById('rememberMe').checked;

            // Get respective individual error label display boxes
            const userIdentErr = document.getElementById('userIdentErr');
            const passwordErr = document.getElementById('passwordErr');
            const roleErr = document.getElementById('roleErr');

            // Reset error messages visibility state
            userIdentErr.style.display = 'none';
            passwordErr.style.display = 'none';
            roleErr.style.display = 'none';
            document.getElementById('outputDiv').style.display = 'none';

            // 1. Validate Username or Email Field Empty State
            if (userIdentInput.value.trim() === "") {
                userIdentErr.style.display = 'block';
                hasErrors = true;
            }

            // 2. Validate Password Field Empty State
            if (passwordInput.value.trim() === "") {
                passwordErr.style.display = 'block';
                hasErrors = true;
            }

            // 3. Validate Radio Group Selected State
            if (!roleSelected) {
                roleErr.style.display = 'block';
                hasErrors = true;
            }

            // If any fields are empty, stop processing
            if (hasErrors) {
                return;
            }

            // If form passes all validation, assemble successfully captured inputs
            const identity = userIdentInput.value.trim();
            const selectedRole = roleSelected.value;
            const rememberStatus = rememberMeChecked ? "Yes" : "No";

            // Populate text elements directly inside targeted container output div
            const outputBox = document.getElementById('outputDiv');
            outputBox.innerHTML = `
                <h3>✓ Validation Successful</h3>
                <p><strong>Identity:</strong> ${identity}</p>
                <p><strong>Assigned Role:</strong> ${selectedRole}</p>
                <p><strong>Stay Logged In:</strong> ${rememberStatus}</p>
            `;
            
            // Uncover div box block to display outputs to users
            outputBox.style.display = 'block';
        });

        // Function execution handling clear layout behaviors safely
        function clearForm() {
            // Reset standard fields matching container form parameters
            document.getElementById('loginForm').reset();
