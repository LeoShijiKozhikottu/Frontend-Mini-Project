<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --bg-color: #f5f7fa;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h2, h3 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 8px;
        }

        .video-box {
            width: 100%;
            margin-bottom: 25px;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        input[type="tel"],
        select,
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .radio-group, .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            padding-top: 5px;
        }

        .radio-group label, .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"] {
            background-color: var(--secondary-color);
            color: white;
        }

        button[type="submit"]:hover {
            background-color: #2980b9;
        }

        button[type="reset"] {
            background-color: #e74c3c;
            color: white;
        }

        button[type="reset"]:hover {
            background-color: #c0392b;
        }

        /* Table Styling */
        .table-container {
            display: none;
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            width: 35%;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Employee Welcome & Registration</h2>
        
        <!-- Welcome Video Section -->
        <div class="video-box">
            <video controls poster="https://placeholder.com">
                <source src="https://w3schools.com" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- Registration Form -->
        <form id="registrationForm" onsubmit="processForm(event)">
            
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe" required minlength="3" maxlength="50">
            </div>

            <div class="form-group">
                <label for="empId">Employee ID</label>
                <input type="text" id="empId" placeholder="EMP12345" required pattern="^[A-Za-z0-9]+$" title="Alphanumeric characters only">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="john.doe@company.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="Male" required> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                    <label><input type="radio" name="gender" value="Other"> Other</label>
                </div>
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <select id="department" required>
                    <option value="">-- Select Department --</option>
                    <option value="IT & Engineering">IT & Engineering</option>
                    <option value="Human Resources">Human Resources</option>
                    <option value="Finance">Finance</option>
                    <option value="Marketing">Marketing</option>
                </select>
            </div>

            <div class="form-group">
                <label>Skills</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="skills" value="HTML5/CSS3"> HTML5/CSS3</label>
                    <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
                    <label><input type="checkbox" name="skills" value="Python"> Python</label>
                    <label><input type="checkbox" name="skills" value="SQL"> SQL</label>
                </div>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" placeholder="10-digit number" required pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number">
            </div>

            <div class="form-group">
                <label for="profilePhoto">Upload Profile Photo</label>
                <input type="file" id="profilePhoto" accept="image/*" required>
            </div>

            <div class="btn-group">
                <button type="submit">Submit</button>
                <button type="reset" onclick="hideTable()">Reset</button>
            </div>

        </form>
    </div>

    <!-- Output Result Table -->
    <div class="table-container" id="resultContainer">
        <h3>Registered Employee Details</h3>
        <table id="resultTable">
            <!-- Dynamic data will be generated here -->
        </table>
    </div>
    <script>
        function processForm(event) {
            // Prevent default page reloading
            event.preventDefault();

            // Fetch password values for match validation
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (pass !== confirmPass) {
                alert("Passwords do not match!");
                return;
            }

            // Fetch values from elements
            const fullName = document.getElementById('fullName').value.trim();
            const empId = document.getElementById('empId').value.trim();
            const email = document.getElementById('email').value.trim();
            const dob = document.getElementById('dob').value;
            const dept = document.getElementById('department').value;
            const mobile = document.getElementById('mobile').value.trim();
            
            // Handle radio button value selection
            const genderNode = document.querySelector('input[name="gender"]:checked');
            const gender = genderNode ? genderNode.value : "";

            // Handle checkboxes array selection
            const checkedSkills = Array.from(document.querySelectorAll('input[name="skills"]:checked'))
                                      .map(cb => cb.value);
            const skills = checkedSkills.length > 0 ? checkedSkills.join(', ') : "";

            // Handle file profile photo tracking
            const photoInput = document.getElementById('profilePhoto');
