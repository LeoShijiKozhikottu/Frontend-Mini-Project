<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin-top: 30px;
        }

        h2 {
            color: #333;
        }

        img {
            width: 700px;
            height: 450px;
            border: 4px solid #333;
            border-radius: 10px;
        }

        #destinationName {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            color: darkblue;
        }

        .instructions {
            margin-top: 20px;
            color: #555;
        }
    </style>
</head>
<body>

    <h2>Travel Photo Gallery</h2>

    <img id="travelImage" src="japan.jpg" alt="Travel Destination">

    <div id="destinationName"></div>

    <div class="instructions">
        <p><b>N</b> → Next Destination</p>
        <p><b>P</b> → Previous Destination</p>
        <p><b>Spacebar</b> → Show Destination Name</p>
    </div>

    <script>
        const destinations = [
            {
                image: "japan.jpg",
                name: "Japan"
            },
            {
                image: "canada.jpg",
                name: "Canada"
            },
            {
                image: "switzerland.jpg",
                name: "Switzerland"
            },
            {
                image: "paris.jpg",
                name: "Paris"
            }
        ];

        let currentIndex = 0;

        const img = document.getElementById("travelImage");
        const destinationName = document.getElementById("destinationName");

        document.addEventListener("keydown", function(event) {

            // N key → Next Destination
            if (event.key === "n" || event.key === "N") {
                currentIndex = (currentIndex + 1) % destinations.length;
                img.src = destinations[currentIndex].image;
                destinationName.innerHTML = "";
            }

            // P key → Previous Destination
            else if (event.key === "p" || event.key === "P") {
                currentIndex =
                    (currentIndex - 1 + destinations.length) %
                    destinations.length;
                img.src = destinations[currentIndex].image;
                destinationName.innerHTML = "";
            }

            // Spacebar → Show Destination Name
            else if (event.code === "Space") {
                event.preventDefault();
                destinationName.innerHTML =
                    destinations[currentIndex].name;
            }
        });
    </script>

</body>
</html>
