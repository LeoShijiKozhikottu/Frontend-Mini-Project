<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Step 3: Cart Summary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="checkout-container">
    <h2>Part C: Cart Summary</h2>
    
    <table class="summary-table">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Quantity</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Wireless Headphones</td>
                <td>1</td>
                <td>₹2,999.00</td>
            </tr>
            <tr>
                <td>Ergonomic Mouse</td>
                <td>2</td>
                <td>₹1,200.00</td>
            </tr>
            <tr class="total-row">
                <td>Total Amount</td>
                <td></td>
                <td>₹4,199.00</td>
            </tr>
        </tbody>
    </table>

    <div class="btn-nav">
        <a href="customer.html" class="btn btn-danger">Cancel</a>
        <div>
            <a href="payment.html" class="btn btn-secondary" style="margin-right: 10px;">➔ Back</a>
            <button type="button" class="btn btn-primary" onclick="alert('Order Placed Successfully!')">Place Order</button>
        </div>
    </div>
</div>

</html>
