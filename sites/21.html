<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }
        .login-card {
            max-width: 450px;
            background: #ffffff;
            padding: 30px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #1a365d;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .audio-box {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 25px;
            text-align: center;
        }
        .audio-box p {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #4a5568;
            font-weight: bold;
        }
        audio {
            width: 100%;
            height: 40px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
            color: #2d3748;
        }
        .inline-label {
            display: inline-block;
            font-weight: normal;
            margin-right: 15px;
            margin-bottom: 0;
            cursor: pointer;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: #3182ce;
            outline: none;
            background-color: #f7fafc;
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: -5px;
            margin-bottom: 20px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #4a5568;
            cursor: pointer;
        }
        .remember-me input {
            margin-right: 6px;
        }
        .links-group a {
            color: #3182ce;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }
        .links-group a:hover {
            text-decoration: underline;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }
        button[type="submit"] {
            background-color: #3182ce;
            color: white;
        }
        button[type="submit"]:hover {
            background-color: #2b6cb0;
        }
        button[type="reset"] {
            background-color: #edf2f7;
            color: #4a5568;
            border: 1px solid #cbd5e0;
        }
        button[type="reset"]:hover {
            background-color: #e2e8f0;
        }
        .footer-links {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Portal Login</h2>
    
    <!-- Audio Instruction Box -->
    <div class="audio-box">
        <p>🔊 Listen to login guide instructions:</p>
        <audio controls>
            <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
            <source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <!-- Login Form -->
    <form action="#" method="POST">
        
        <!-- User Role Selection -->
        <div class="form-group">
            <label>User Role</label>
            <div>
                <label class="inline-label"><input type="radio" name="userRole" value="student" required checked> Student</label>
                <label class="inline-label"><input type="radio" name="userRole" value="faculty"> Faculty</label>
            </div>
        </div>

        <!-- Username or Email Address -->
        <div class="form-group">
            <label for="loginIdentity">Username or Email Address</label>
            <input type="text" id="loginIdentity" name="loginIdentity" placeholder="Enter username or email" required minlength="4">
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>

        <!-- Remember Me and Forgot Password Flex Grid -->
        <div class="flex-row">
            <label class="remember-me">
                <input type="checkbox" name="rememberMe" value="yes"> Remember Me
            </label>
            <div class="links-group">
                <a href="#forgot-password">Forgot Password?</a>
            </div>
        </div>

        <!-- Form Action Buttons -->
        <div class="btn-group">
            <button type="submit">Login</button>
            <button type="reset">Clear</button>
        </div>

    </form>

    <!-- Navigation Link to Registration -->
    <div class="footer-links">
        Don't have an account? <div class="links-group" style="display:inline;"><a href="#create-account">Create New Account</a></div>
    </div>
</div>

</body>
</html>
