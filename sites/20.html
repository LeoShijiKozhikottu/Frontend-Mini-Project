<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            background: #ffffff;
            padding: 30px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .video-section {
            text-align: center;
            margin-bottom: 30px;
        }
        video {
            width: 100%;
            max-width: 560px;
            border-radius: 4px;
            background-color: #000;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .inline-label {
            display: inline-block;
            font-weight: normal;
            margin-right: 15px;
            margin-bottom: 0;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        input[type="tel"],
        select,
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: #3498db;
            outline: none;
            background-color: #f9fbfd;
        }
        .checkbox-group, .radio-group {
            padding-top: 5px;
        }
        .btn-group {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"] {
            background-color: #2ecc71;
            color: white;
        }
        button[type="submit"]:hover {
            background-color: #27ae60;
        }
        button[type="reset"] {
            background-color: #e74c3c;
            color: white;
        }
        button[type="reset"]:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Welcome Video Section -->
    <div class="video-section">
        <h2>Welcome to the Team!</h2>
        <p>Please watch this short onboarding video before registering.</p>
        <video controls poster="https://via.placeholder.com/560x315?text=Onboarding+Video">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            <source src="https://www.w3schools.com/html/mov_bbb.ogg" type="video/ogg">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Registration Form Section -->
    <h3>Employee Registration Form</h3>
    <form action="#" method="POST" enctype="multipart/form-data">
        
        <!-- Full Name -->
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="John Doe" required minlength="2" maxlength="50">
        </div>

        <!-- Employee ID -->
        <div class="form-group">
            <label for="employeeId">Employee ID</label>
            <input type="text" id="employeeId" name="employeeId" placeholder="EMP-12345" pattern="EMP-[0-9]{5}" title="Format must be EMP- followed by 5 digits" required>
        </div>

        <!-- Email Address -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="johndoe@company.com" required>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Minimum 8 characters" minlength="8" required>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" minlength="8" required>
        </div>

        <!-- Date of Birth -->
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <!-- Gender -->
        <div class="form-group">
            <label>Gender</label>
            <div class="radio-group">
                <label class="inline-label"><input type="radio" name="gender" value="male" required> Male</label>
                <label class="inline-label"><input type="radio" name="gender" value="female"> Female</label>
                <label class="inline-label"><input type="radio" name="gender" value="other"> Other</label>
            </div>
        </div>

        <!-- Department -->
        <div class="form-group">
            <label for="department">Department</label>
            <select id="department" name="department" required>
                <option value="" disabled selected>Select your department</option>
                <option value="hr">Human Resources</option>
                <option value="engineering">Engineering</option>
                <option value="marketing">Marketing</option>
                <option value="finance">Finance</option>
                <option value="sales">Sales</option>
            </select>
        </div>

        <!-- Skills -->
        <div class="form-group">
            <label>Skills</label>
            <div class="checkbox-group">
                <label class="inline-label"><input type="checkbox" name="skills" value="html"> HTML5 / CSS3</label>
                <label class="inline-label"><input type="checkbox" name="skills" value="javascript"> JavaScript</label>
                <label class="inline-label"><input type="checkbox" name="skills" value="python"> Python</label>
                <label class="inline-label"><input type="checkbox" name="skills" value="design"> UI/UX Design</label>
            </div>
        </div>

        <!-- Mobile Number -->
        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" required>
        </div>

        <!-- Upload Profile Photo -->
        <div class="form-group">
            <label for="profilePhoto">Upload Profile Photo</label>
            <input type="file" id="profilePhoto" name="profilePhoto" accept="image/*" required>
        </div>

        <!-- Form Buttons -->
        <div class="btn-group">
            <button type="submit">Submit Registration</button>
            <button type="reset">Reset Form</button>
        </div>

    </form>
</div>

</body>
</html>
