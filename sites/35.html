<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM PIN Entry Simulation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .atm-machine {
            background: #1e293b;
            border: 4px solid #334155;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .screen {
            background: #022c22;
            border: 2px solid #059669;
            border-radius: 10px;
            padding: 20px;
            color: #34d399;
            text-align: center;
            min-height: 170px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(5, 150, 105, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .screen-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6ee7b7;
            margin-bottom: 12px;
        }
        .pin-dots {
            display: flex;
            gap: 14px;
            margin: 15px 0;
        }
        .dot {
            width: 18px;
            height: 18px;
            border: 2px solid #34d399;
            border-radius: 50%;
            background: transparent;
            transition: 0.2s;
        }
        .dot.filled {
            background: #34d399;
            box-shadow: 0 0 10px #34d399;
        }
        .screen-msg {
            font-size: 13px;
            color: #a7f3d0;
            min-height: 20px;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .key {
            background: #334155;
            border: 1px solid #475569;
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            padding: 14px 0;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 0 #1e293b;
            transition: all 0.1s;
            user-select: none;
        }
        .key:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1e293b;
        }
        .key.clear {
            background: #b45309;
            border-color: #d97706;
            font-size: 14px;
            font-weight: 800;
        }
        .key.enter {
            background: #15803d;
            border-color: #16a34a;
            font-size: 14px;
            font-weight: 800;
        }
        .atm-options {
            display: none;
            width: 100%;
            text-align: left;
        }
        .opt-btn {
            background: rgba(5, 150, 105, 0.2);
            border: 1px solid #059669;
            color: #a7f3d0;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 6px 0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: block;
            width: 100%;
            text-align: left;
        }
        .opt-btn:hover {
            background: rgba(5, 150, 105, 0.4);
        }
    </style>
</head>
<body>
    <div class="atm-machine">
        <div class="screen" id="atmScreen">
            <div id="pinEntryView">
                <div class="screen-title">VIT Student Bank ATM</div>
                <div style="font-size: 13px;">Please enter your 4-digit PIN:</div>
                <div class="pin-dots">
                    <div class="dot" id="dot0"></div>
                    <div class="dot" id="dot1"></div>
                    <div class="dot" id="dot2"></div>
                    <div class="dot" id="dot3"></div>
                </div>
                <div class="screen-msg" id="screenMsg">Hint: Default PIN is 1234 or any 4 digits</div>
            </div>

            <div class="atm-options" id="optionsView">
                <div style="font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #fff;">Welcome, Leo Shiji!</div>
                <div style="font-size: 12px; color: #a7f3d0; margin-bottom: 10px;">Select a Banking Service:</div>
                <button class="opt-btn" onclick="showBalance()">💰 Check Account Balance</button>
                <button class="opt-btn" onclick="withdrawCash()">💵 Fast Cash ₹1,000</button>
                <button class="opt-btn" onclick="resetATM()">🛑 Exit &amp; Eject Card</button>
            </div>
        </div>

        <div class="keypad">
            <div class="key" onclick="pressDigit('1')">1</div>
            <div class="key" onclick="pressDigit('2')">2</div>
            <div class="key" onclick="pressDigit('3')">3</div>
            <div class="key" onclick="pressDigit('4')">4</div>
            <div class="key" onclick="pressDigit('5')">5</div>
            <div class="key" onclick="pressDigit('6')">6</div>
            <div class="key" onclick="pressDigit('7')">7</div>
            <div class="key" onclick="pressDigit('8')">8</div>
            <div class="key" onclick="pressDigit('9')">9</div>
            <div class="key clear" onclick="clearPIN()">CLEAR</div>
            <div class="key" onclick="pressDigit('0')">0</div>
            <div class="key enter" onclick="submitPIN()">ENTER</div>
        </div>
    </div>

    <script>
        let pin = "";
        let balance = 45250.00;

        function pressDigit(d) {
            if (pin.length < 4) {
                pin += d;
                updateDots();
            }
        }

        function clearPIN() {
            pin = "";
            updateDots();
            document.getElementById('screenMsg').textContent = "PIN Cleared. Please re-enter.";
        }

        function updateDots() {
            for (let i = 0; i < 4; i++) {
                const el = document.getElementById(`dot${i}`);
                if (i < pin.length) {
                    el.classList.add('filled');
                } else {
                    el.classList.remove('filled');
                }
            }
        }

        function submitPIN() {
            const msg = document.getElementById('screenMsg');
            if (pin.length !== 4) {
                msg.textContent = "Please enter complete 4 digits!";
                return;
            }

            // PIN verified
            msg.textContent = "Validating Security Credentials...";
            setTimeout(() => {
                document.getElementById('pinEntryView').style.display = 'none';
                document.getElementById('optionsView').style.display = 'block';
            }, 600);
        }

        function showBalance() {
            alert(`Account: Savings XXXX-9006\nAvailable Balance: ₹${balance.toLocaleString('en-IN', {minimumFractionDigits: 2})}`);
        }

        function withdrawCash() {
            if (balance >= 1000) {
                balance -= 1000;
                alert(`Transaction Successful!\nWithdrawn: ₹1,000.00\nRemaining Balance: ₹${balance.toLocaleString('en-IN', {minimumFractionDigits: 2})}`);
            } else {
                alert("Insufficient funds!");
            }
        }

        function resetATM() {
            pin = "";
            updateDots();
            document.getElementById('optionsView').style.display = 'none';
            document.getElementById('pinEntryView').style.display = 'block';
            document.getElementById('screenMsg').textContent = "Card Ejected. Thank you!";
        }
    </script>
</body>
</html>
