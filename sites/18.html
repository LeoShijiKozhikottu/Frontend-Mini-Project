<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
</head>
<body style="background-color: #f3f4f6; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box;">

    <!-- System Dashboard Title -->
    <div style="font-size: 36px; font-weight: bold; color: #1f2937; text-align: center; margin-bottom: 40px; letter-spacing: 0.5px;">
        Library Management System
    </div>

    <!-- 2x2 Grid Layout Container using Flexbox -->
    <div style="display: flex; flex-wrap: wrap; max-width: 640px; width: 100%; gap: 20px; justify-content: center;">
        
        <!-- Block 1: Books -->
        <div style="background-color: #3b82f6; width: 280px; height: 200px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s;">
            <img src="book.jpg" alt="Books Icon" style="width: 70px; height: 70px; border-radius: 8px; margin-bottom: 15px; border: 2px solid rgba(255,255,255,0.4); object-fit: cover;">
            <div style="font-size: 20px; font-weight: 600; color: #ffffff; text-transform: uppercase; letter-spacing: 1px;">
                Books
            </div>
        </div>

        <!-- Block 2: Members -->
        <div style="background-color: #10b981; width: 280px; height: 200px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s;">
            <img src="members.jpg" alt="Members Icon" style="width: 70px; height: 70px; border-radius: 8px; margin-bottom: 15px; border: 2px solid rgba(255,255,255,0.4); object-fit: cover;">
            <div style="font-size: 20px; font-weight: 600; color: #ffffff; text-transform: uppercase; letter-spacing: 1px;">
                Members
            </div>
        </div>

        <!-- Block 3: Issue Books -->
        <div style="background-color: #f59e0b; width: 280px; height: 200px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s;">
            <img src="issue_books.jpg" alt="Issue Books Icon" style="width: 70px; height: 70px; border-radius: 8px; margin-bottom: 15px; border: 2px solid rgba(255,255,255,0.4); object-fit: cover;">
            <div style="font-size: 20px; font-weight: 600; color: #ffffff; text-transform: uppercase; letter-spacing: 1px;">
                Issue Books
            </div>
        </div>

        <!-- Block 4: Digital Library -->
        <div style="background-color: #8b5cf6; width: 280px; height: 200px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s;">
            <img src="digital_library.jpg" alt="Digital Library Icon" style="width: 70px; height: 70px; border-radius: 8px; margin-bottom: 15px; border: 2px solid rgba(255,255,255,0.4); object-fit: cover;">
            <div style="font-size: 20px; font-weight: 600; color: #ffffff; text-transform: uppercase; letter-spacing: 1px;">
                Digital Library
            </div>
        </div>

    </div>

</body>
</html>
