<!DOCTYPE html>
<html>
<head>
    <title>Hospital Management Header</title>
</head>

<body>

<div style="width:100%; border:1px solid black; padding:15px; background-color:#f2f2f2;">

    <table width="100%" cellpadding="10">

        <tr>

            <!-- Hospital Logo -->
            <td width="15%" align="center">
                <div style="font-size:24px; font-weight:bold; color:darkblue;">
                    🏥 Care Hospital
                </div>
            </td>

            <!-- Hospital Location -->
            <td width="18%" align="center">
                <b>Branch</b><br>
                Vellore,<br>
                Tamil Nadu
            </td>

            <!-- Search Bar -->
            <td width="35%" align="center">

                <select style="padding:5px;">
                    <option>Department</option>
                    <option>Cardiology</option>
                    <option>Neurology</option>
                    <option>Orthopedics</option>
                    <option>Pediatrics</option>
                </select>

                <input type="text" placeholder="Search Doctor or Department"
                style="padding:5px; width:180px;">

                <button style="padding:6px 12px;">
                    🔍 Search
                </button>

            </td>

            <!-- Patient Portal -->
            <td width="12%" align="center">
                <b>Welcome, Patient</b><br>
                My Profile
            </td>

            <!-- Appointments -->
            <td width="12%" align="center">
                <b>Book Appointment</b><br>
                My Appointments
            </td>

            <!-- Emergency -->
            <td width="8%" align="center">
                <span style="color:red; font-weight:bold;">
                    🚑 Emergency: 108
                </span>
            </td>

        </tr>

    </table>

</div>

</body>
</html>
